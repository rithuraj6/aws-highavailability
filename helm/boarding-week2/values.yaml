replicaCount: 2

image:
  repository: 551162198888.dkr.ecr.ap-south-1.amazonaws.com/boarding-week2
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: true
  className: alb
  scheme: internet-facing
  targetType: ip
  healthcheckPath: /health
